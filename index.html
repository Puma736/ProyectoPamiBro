<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Para Juany — Jardín mágico 3D de flores amarillas">
    <title>🌻 Para Juany</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw; height: 100vh;
            font-family: 'Playfair Display', serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* ── Intro ── */
        #intro {
            position: fixed; inset: 0; z-index: 200;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 60%,
                #1a2a00 0%, #0d1500 35%, #000 75%);
            transition: opacity 1.4s ease, visibility 1.4s ease;
        }
        #intro.hidden { opacity:0; visibility:hidden; pointer-events:none; }

        .intro-emoji {
            font-size: 3rem; margin-bottom: 1.5rem;
            animation: pulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(245,197,24,.5));
        }
        .intro-sub {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; color: #D9A441;
            letter-spacing: .15em; margin-bottom: 1.4rem;
            opacity:0; animation: fadeUp .9s .3s forwards;
        }
        .intro-title {
            font-size: clamp(1.8rem, 5vw, 3rem); font-weight:600;
            color: #FFF8DC; text-align:center; line-height:1.3;
            margin-bottom: 1.2rem; text-shadow: 0 0 40px rgba(245,197,24,.15);
            opacity:0; animation: fadeUp .9s .6s forwards;
        }
        .intro-hint {
            font-family: 'Dancing Script', cursive;
            font-size: 1.05rem; font-style:italic;
            color: rgba(255,248,220,.55); text-align:center;
            margin-bottom: 2.4rem; max-width:440px; padding:0 1.5rem; line-height: 1.5;
            opacity:0; animation: fadeUp .9s .9s forwards;
        }
        #enter-btn {
            font-family: 'Playfair Display', serif; font-size: 1.1rem;
            padding: 1rem 3rem; border-radius: 50px;
            border: 2px solid rgba(245,197,24,0.6);
            background: linear-gradient(135deg, rgba(245,197,24,0.1), rgba(245,197,24,0.3));
            color: #F5C518;
            cursor: pointer; letter-spacing: .15em; font-weight: 600;
            transition: all .4s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(245,197,24,0.2), inset 0 0 15px rgba(245,197,24,0.1);
            text-transform: uppercase;
            opacity:0; animation: fadeUp .9s 1.2s forwards;
        }
        #enter-btn:hover {
            background: linear-gradient(135deg, rgba(245,197,24,0.3), rgba(245,197,24,0.6));
            border-color: #F5C518; color: #FFF;
            box-shadow: 0 0 40px rgba(245,197,24,0.6), inset 0 0 20px rgba(245,197,24,0.3);
            transform: translateY(-4px) scale(1.03);
        }

        /* ── Canvas ── */
        #canvas-wrap {
            position: fixed; inset: 0; z-index: 1;
            opacity: 0; transition: opacity 2s ease;
        }
        #canvas-wrap.show { opacity: 1; }
        #canvas-wrap canvas { display:block; }

        /* ── Textos flotantes ── */
        #labels {
            position: fixed; inset: 0; z-index: 10;
            pointer-events: none; overflow: hidden;
        }
        .label {
            position: absolute;
            font-family: 'Dancing Script', cursive;
            font-size: 1.05rem; font-weight: 600;
            color: #fff;
            text-shadow:
                0 0 6px rgba(255,220,50,.9),
                0 0 18px rgba(255,200,0,.5),
                0 0 35px rgba(255,180,0,.25);
            white-space: nowrap;
            transform: translate(-50%, -120%);
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s;
        }

        /* ── Carta ── */
        #card-overlay {
            position: fixed; inset: 0; z-index: 300;
            display: flex; align-items:center; justify-content:center;
            padding: 1rem;
            background: rgba(0,0,0,0);
            visibility: hidden; opacity: 0;
            transition: background .5s, opacity .4s, visibility .4s;
        }
        #card-overlay.show {
            background: rgba(0,0,0,.75);
            visibility: visible; opacity: 1;
        }
        .card {
            width: min(88vw, 400px);
            padding: 2.6rem 2rem 1.8rem;
            background: linear-gradient(150deg,#FFF9EC,#FFF0CF,#FFEAD0);
            border-radius: 18px;
            box-shadow: 0 25px 70px rgba(0,0,0,.6), 0 0 60px rgba(245,197,24,.08);
            text-align: center;
            transform: scale(.78) translateY(30px);
            transition: transform .6s cubic-bezier(.34,1.56,.64,1), opacity .4s;
            opacity: 0;
        }
        #card-overlay.show .card { transform: scale(1) translateY(0); opacity: 1; }
        .card-icon { font-size: 2.5rem; margin-bottom: 1rem; animation: pulse 3s infinite; }
        .card-title { font-size: 1.5rem; font-weight:600; color:#3D2700; margin-bottom:1rem; }
        .card-msg {
            font-family: 'Dancing Script', cursive;
            font-size: 1.15rem; color: #5C3D10;
            line-height: 1.7; margin-bottom: 1.6rem;
        }
        .card-deco { font-size: 1.2rem; opacity:.5; margin-bottom: 1.2rem; }
        .card-close {
            font-family: 'Playfair Display', serif; font-size: .9rem;
            padding: .6rem 1.8rem; border-radius: 50px;
            border: 1px solid rgba(61,39,0,.25);
            background: transparent; color: #3D2700; cursor: pointer;
            transition: all .3s;
        }
        .card-close:hover { background: rgba(61,39,0,.08); }

        /* ── Botón música ── */
        #btn-music {
            position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50;
            width: 48px; height: 48px; border-radius: 50%;
            border: 1px solid rgba(245,197,24,.25);
            background: rgba(0,0,0,.5); backdrop-filter: blur(12px);
            color: #F5C518; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items:center; justify-content:center;
            opacity: 0; transform: translateY(20px);
            transition: all .4s;
        }
        #btn-music.show { opacity:1; transform: translateY(0); }
        #btn-music:hover { background: rgba(245,197,24,.1); border-color:rgba(245,197,24,.5); }

        /* ── Keyframes ── */
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(20px); }
            to   { opacity:1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50%      { transform: scale(1.06); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .2s !important;
            }
        }
    </style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
    <div class="intro-emoji">🌻</div>
    <p class="intro-sub">Para Juany</p>
    <h1 class="intro-title">Un jardín en el universo<br>solo para ti</h1>
    <p class="intro-hint">Hay un mensaje escondido en cada flor ✨<br>Puedes rotar y hacer zoom a la galaxia 🪐</p>
    <button id="enter-btn">Entrar al jardín 🌻</button>
</div>

<!-- ESCENA 3D -->
<div id="canvas-wrap"></div>

<!-- TEXTOS FLOTANTES -->
<div id="labels"></div>

<!-- CARTA -->
<div id="card-overlay" role="dialog" aria-hidden="true">
    <div class="card">
        <div class="card-icon">🌼</div>
        <h2 class="card-title" id="card-title"></h2>
        <p  class="card-msg"   id="card-msg"></p>
        <div class="card-deco">🌻</div>
        <button class="card-close" id="btn-close">Cerrar</button>
    </div>
</div>

<!-- MÚSICA -->
<button id="btn-music" aria-label="Música">🔇</button>
<audio id="bg-audio" loop preload="none">
    <source src="videoplayback.m4a" type="audio/mp4">
</audio>

<!-- THREE.JS & ORBIT CONTROLS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="app.js"></script>
</body>
</html>
